{% extends 'base_page.html' %}


{% block links_base %}
<script src="http://127.0.0.1:8000/public/js/userForm.js" type="text/javascript"></script>
{% endblock links_base %}


{% set current_page = 'create_acount' %}


{% block main_base %}
{% include 'errors_pop_up.html' %}
<div class="container d-flex justify-content-center align-items-center container-center-h-big">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-8">
            
            <div class="card shadow-sm border-0 px-4 py-4 rounded-3">
                <div class="card-body">
                    
                    <h2 class="card-title text-center fw-bold mb-4 text-dark">Create Account</h2>
                    
                    <form action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="first-name" class="form-label text-secondary fs-7">First Name</label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="first-name" 
                                   name="first_name" 
                                   placeholder="first-name" 
                                   value="{% if user_params is defined %}{{user_params.first_name}}{% endif %}" 
                                   required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="last-name" class="form-label text-secondary fs-7">Last Name</label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="last-name" 
                                   name="last_name" 
                                   placeholder="last-name" 
                                   value="{% if user_params is defined %}{{user_params.last_name}}{% endif %}" 
                                   required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary fs-7">Email</label>
                            <input type="email" 
                                   class="form-control form-control-lg" 
                                   id="email" 
                                   name="email" 
                                   placeholder="email" 
                                   value="{% if user_params is defined %}{{user_params.email}}{% endif %}" 
                                   required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary fs-7">Password</label>
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   id="password" 
                                   name="raw_password" 
                                   placeholder="••••••••" 
                                   required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirm-password" class="form-label text-secondary fs-7">Confirm Password</label>
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   id="confirm-password" 
                                   name="confirm_password" 
                                   placeholder="••••••••" 
                                   required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="phone-number" class="form-label text-secondary fs-7">Phone Number</label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="phone-number" 
                                   name="phone_number" 
                                   placeholder="000-00-00-00" 
                                   pattern="[0-9 +-]*" 
                                   value="{% if user_params is defined %}{{user_params.phone_number}}{% endif %}" 
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="height" class="form-label text-secondary fs-7">Height (meters)</label>
                            <input type="number" 
                                   class="form-control form-control-lg" 
                                   id="height" 
                                   name="height" 
                                   placeholder="1.75" 
                                   step="0.01" 
                                   value="{% if user_params is defined %}{{user_params.height}}{% endif %}" 
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="weight" class="form-label text-secondary fs-7">Weight (Kg)</label>
                            <input type="number" 
                                   class="form-control form-control-lg" 
                                   id="weight" 
                                   name="weight" 
                                   placeholder="85" 
                                   step="0.1" 
                                   value="{% if user_params is defined %}{{user_params.weight}}{% endif %}" 
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="birth-date" class="form-label text-secondary fs-7">Birth Date</label>
                            <input type="date" 
                                   class="form-control form-control-lg" 
                                   id="birth-date" 
                                   name="birth_date" 
                                   value="{% if user_params is defined %}{{user_params.birth_date}}{% endif %}" 
                                   required>
                        </div>

                        <div class="mb-4">
                            {% if user_params is defined %}
                            <input type="hidden" value="{{user_params.gender}}" id="gender-from-dto">
                            {% endif %}
                            <label for="birth-date" class="form-label text-secondary fs-7">Gender</label>
                            <div class="mb-4 form-check disabled">
                                <input class="form-check-input" 
                                       type="radio" 
                                       name="gender" 
                                       id="gender-male" 
                                       value="1">
                                <label class="form-check-label" for="gender-male">
                                    Male
                                </label>
                            </div>
                            <div class="mb-4 form-check disabled">
                                <input class="form-check-input" 
                                       type="radio" 
                                       name="gender" 
                                       id="gender-female" 
                                       value="2">
                                <label class="form-check-label" for="gender-female">
                                    Female
                                </label>
                            </div>
                            <div class="mb-4 form-check disabled">
                                <input class="form-check-input" 
                                       type="radio" 
                                       name="gender" 
                                       id="gender-other" 
                                       value="3">
                                <label class="form-check-label" for="gender-other">
                                    Other
                                </label>
                            </div>
                        </div>

                        <!-- TODO: button file to import profile picture -->

                        
                        <div class="mb-3 d-flex justify-content-center gap-2">
                            <button type="cancel" class="btn btn-danger btn-lg fw-semibold w-50" onclick="history.back()">Cancel</button>
                            <button type="submit" class="btn btn-success btn-lg fw-semibold w-50">Create</button>
                        </div>
                        
                    </form>
                    
                </div>
            </div>
            </div>
    </div>
</div>
{% endblock main_base %}
