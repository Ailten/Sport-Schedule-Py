<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Calories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">  <!-- min to take -->
            <div class="col-md-8 col-lg-6" style="width: 80vw;">
                
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">Kcalories dépencée par semaine</h4>
                    </div>
                    <div class="card-body">
                        <canvas id="calorie-chart"></canvas>
                    </div>
                    <div class="card-footer text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="chargerDonneesExemple()">
                            Simuler chargement données App
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Initialisation du graphique avec des données par défaut (vides ou initiales)
        const canva = document.getElementById('calorie-chart');

        //canva.style.width='1200px';
        //canva.style.height='800px';
        //canva.style.setAttribute('width', '1200px');
        //canva.style.setAttribute('height', '800px');

        const ctx = canva.getContext('2d');
        
        const calorieChart = new Chart(ctx, {
            type: 'bar', // Type de graphique : Histogramme (bâtons)
            data: {
                labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], // Axe X
                datasets: [{
                    label: 'Calories consommées (kcal)',
                    data: [0, 0, 0, 0, 0, 0, 0], // Axe Y (initialisé à 0)
                    backgroundColor: 'rgba(13, 110, 253, 0.6)', // Bleu Bootstrap avec opacité
                    borderColor: 'rgb(13, 110, 253)', // Bleu Bootstrap plein
                    borderWidth: 1,
                    borderRadius: 5 // Optionnel : arrondit le haut des bâtons
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Kcal'
                        }
                    }
                }
            }
        });

        /**
         * 2. FONCTION CLÉ POUR TON APPLICATION
         * Cette fonction te montre comment mettre à jour le graphique facilement.
         * Il te suffit de l'appeler en lui passant un tableau de 7 valeurs.
         */
        function mettreAJourGraphique(nouvellesCalories) {
            // On remplace les anciennes données par les nouvelles
            calorieChart.data.datasets[0].data = nouvellesCalories;
            // On demande à Chart.js de rafraîchir le visuel avec animation
            calorieChart.update();
        }

        // --- Exemple de simulation d'injection de données ---
        function chargerDonneesExemple() {
            // Disons que ton application récupère ce tableau depuis une API ou une base de données :
            const donneesApp = [2100, 1850, 2400, 1900, 2250, 2600, 2000];
            
            // On appelle la fonction de mise à jour
            mettreAJourGraphique(donneesApp);
        }
    </script>

</body>
</html>
