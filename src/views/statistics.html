<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sport Schedules</title>
    <link href="http://127.0.0.1:8000/public/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" >
    <script src="http://127.0.0.1:8000/public/bootstrap/bootstrap.bundle.min.js"></script>
    <link href="http://127.0.0.1:8000/public/css/main.css" rel="stylesheet">
    <script src="http://127.0.0.1:8000/public/js/statistics.js" type="text/javascript"></script>
    <script src="http://127.0.0.1:8000/public/chartJs/chart.js" type="text/javascript"></script>
    <link href="http://127.0.0.1:8000/public/css/statistics.css" rel="stylesheet">

</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- main contend -->
            <main class="col-md-9 col-lg-10 p-4 container-center-h-short main-container w-100">
                

                <div class="row justify-content-center statistics-container">
                    <div class="col-md-8 col-lg-6" style="width: 80vw;">
                        
                        <div class="card shadow-sm">
                            <div class="card-header bg-dark text-white text-center">
                                <h4 class="mb-0">Kcalories burn by week</h4>
                            </div>
                            <div class="card-body">
                                <canvas id="calorie-chart"></canvas>
                            </div>
                            <!--
                            <div class="card-footer text-end">
                                <button class="btn btn-sm btn-outline-secondary" onclick="chargerDonneesExemple()">
                                    Simuler chargement données App
                                </button>
                            </div>
                            -->
                        </div>
        
                    </div>
                </div>


            </main>

            <!-- menu -->
            <aside class="col-md-3 col-lg-2 bg-white sidebar-right p-3 d-flex flex-column align-items-center h-100 navigation-menu">
                
                <div class="text-center my-2">
                    <img src="http://127.0.0.1:8000/public/img/userPfp/default_user.png" 
                         alt="Photo de profil" 
                         class="rounded-circle profile-img border border-3 border-primary shadow-sm">
                    <h5 class="mt-2 mb-0 text-dark fw-bold">first-name last-name</h5>
                    <small class="text-muted">Role</small>
                </div>

                <hr class="w-100 my-2">

                <div class="w-100 d-flex gap-2 align-items-start nav nav-pills flex-column">
                    <button class="btn btn-primary text-start w-100 active" type="button" onclick="window.location.href='schedule.html'">
                        <i class="bi bi-calendar me-2"></i>
                        Schedules
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button" onclick="window.location.href='create_schedule.html'">
                        <i class="bi bi-calendar-plus me-2"></i>
                        New Schedules
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button" onclick="window.location.href='statistics.html'">
                        <i class="bi bi-graph-up me-2"></i>
                        Statistics
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button" onclick="window.location.href='update_account.html'">
                        <i class="bi bi-gear me-2"></i>
                        Parameters
                    </button>
                    <button class="btn btn-outline-danger text-start w-100 border-0" type="button" onclick="window.location.href='login.html'">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Log Out
                    </button>
                </div>

            </aside>

        </div>
    </div>
</body>
</html>
