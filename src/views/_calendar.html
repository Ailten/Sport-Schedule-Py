<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Dynamique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/text/collapse.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Style personnalisé pour les petits rectangles des jours */
        .day-card {
            min-height: 90px;
            height: 100%;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        .day-card:hover {
            transform: scale(1.03);
            background-color: #f8f9fa !important;
        }
        .day-none {
            min-height: 90px;
            background-color: #e9ecef;
            opacity: 0.6;
        }
        .today {
            border: 2px solid #0d6efd !important;
            background-color: #e7f1ff !important;
        }
        .day-number {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm p-4 bg-white">
        
        <div class="row g-3 align-items-center mb-4">
            <div class="col-auto">
                <label for="monthSelect" class="form-label fw-bold mb-0">Mois :</label>
            </div>
            <div class="col-auto">
                <select id="monthSelect" class="form-select">
                    <option value="0">Janvier</option>
                    <option value="1">Février</option>
                    <option value="2">Mars</option>
                    <option value="3">Avril</option>
                    <option value="4">Mai</option>
                    <option value="5">Juin</option>
                    <option value="6">Juillet</option>
                    <option value="7">Août</option>
                    <option value="8">Septembre</option>
                    <option value="9">Octobre</option>
                    <option value="10">Novembre</option>
                    <option value="11">Décembre</option>
                </select>
            </div>
            <div class="col-auto">
                <label for="yearSelect" class="form-label fw-bold mb-0">Année :</label>
            </div>
            <div class="col-auto">
                <select id="yearSelect" class="form-select"></select>
            </div>
        </div>

        <div class="row row-cols-7 text-center fw-bold bg-dark text-white rounded-top py-2 g-0" style="display: grid; grid-template-columns: repeat(7, 1fr);">
            <div>Lun</div>
            <div>Mar</div>
            <div>Mer</div>
            <div>Jeu</div>
            <div>Ven</div>
            <div>Sam</div>
            <div>Dim</div>
        </div>

        <div id="calendarGrid" class="row g-1 border border-top-0 rounded-bottom p-1 bg-light" style="display: grid; grid-template-columns: repeat(7, 1fr);">
            </div>

    </div>
</div>

<script>
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const calendarGrid = document.getElementById('calendarGrid');

    // Initialisation des années (de 2020 à 2035)
    const currentYear = new Date().getFullYear();
    const currentMonth = new Date().getMonth();
    const todayDate = new Date().getDate();

    for (let i = currentYear - 5; i <= currentYear + 10; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = i;
        if (i === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
    }

    // Sélectionner le mois actuel par défaut
    monthSelect.value = currentMonth;

    function generateCalendar(month, year) {
        calendarGrid.innerHTML = '';

        // Premier jour du mois (0 = Dimanche, 1 = Lundi, etc.)
        let firstDay = new Date(year, month, 1).getDay();
        // Ajustement pour que la semaine commence le Lundi (0 = Lundi ... 6 = Dimanche)
        let startingDay = firstDay === 0 ? 6 : firstDay - 1;

        // Nombre de jours dans le mois
        let daysInMonth = new Date(year, month + 1, 0).getDate();

        // 1. Ajouter les cases vides pour les jours du mois précédent
        for (let i = 0; i < startingDay; i++) {
            let emptyCell = document.createElement('div');
            emptyCell.className = "day-none border rounded m-1";
            calendarGrid.appendChild(emptyCell);
        }

        // 2. Ajouter les rectangles pour chaque jour du mois
        for (let day = 1; day <= daysInMonth; day++) {
            let dayCell = document.createElement('div');
            dayCell.className = "card day-card border rounded m-1 p-2 bg-white d-flex flex-column justify-content-between";
            
            // Vérifier si c'est aujourd'hui
            if (day === todayDate && month === currentMonth && year === currentYear) {
                dayCell.classList.add('today');
            }

            dayCell.innerHTML = `
                <div class="text-start day-number">${day}</div>
                <div class="text-end text-muted small" style="font-size: 0.75rem;">---</div>
            `;
            
            calendarGrid.appendChild(dayCell);
        }
    }

    // Écouteurs d'événements pour mettre à jour le calendrier au changement de sélection
    monthSelect.addEventListener('change', () => generateCalendar(parseInt(monthSelect.value), parseInt(yearSelect.value)));
    yearSelect.addEventListener('change', () => generateCalendar(parseInt(monthSelect.value), parseInt(yearSelect.value)));

    // Premier rendu au chargement de la page
    generateCalendar(currentMonth, currentYear);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
