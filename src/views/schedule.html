<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sport Schedules</title>
    <link href="../bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" >
    <script src="../bootstrap/bootstrap.bundle.min.js" type="text/javascript"></script>
    <link href="../css/main.css" rel="stylesheet">
    <script src="../js/calendar.js" type="text/javascript"></script>

</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- main contend -->
            <main class="col-md-9 col-lg-10 p-4 container-center-h-short main-container">


                <div class="container py-5">
                    <div class="card shadow-sm p-4 bg-white">
                        
                        <div class="row g-3 align-items-center mb-2">
                            <div class="col-auto">
                                <label for="month-picker" class="form-label fw-bold mb-0">Month :</label>
                            </div>
                            <div class="col-auto">
                                <input type="month" id="month-picker" name="month-picker" class="form-control">
                            </div>
                        </div>
                
                        <div class="row row-cols-7 text-center fw-bold text-white rounded-top py-2 g-0 header-calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr);">
                            <div>Monday</div>
                            <div>Tuesday</div>
                            <div>Wednesday</div>
                            <div>Thursday</div>
                            <div>Friday</div>
                            <div>Saturday</div>
                            <div>Sunday</div>
                        </div>
                
                        <div id="calendarGrid" class="row g-1 border border-top-0 rounded-bottom p-1 bg-light" style="display: grid; grid-template-columns: repeat(7, 1fr);">
                        </div>
                
                    </div>
                </div>


            </main>

            <!-- menu -->
            <aside class="col-md-3 col-lg-2 bg-white sidebar-right p-3 d-flex flex-column align-items-center h-100 navigation-menu">
                
                <div class="text-center my-2">
                    <img src="../img/default_user.png" 
                         alt="Photo de profil" 
                         class="rounded-circle profile-img border border-3 border-primary shadow-sm">
                    <h5 class="mt-2 mb-0 text-dark fw-bold">first-name last-name</h5>
                    <small class="text-muted">Role</small>
                </div>

                <hr class="w-100 my-2">

                <div class="w-100 d-flex gap-2 align-items-start nav nav-pills flex-column">
                    <button class="btn btn-primary text-start w-100 active" type="button">
                        <i class="bi bi-calendar me-2"></i>
                        Schedules
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button">
                        <i class="bi bi-calendar-plus me-2"></i>
                        New Schedules
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button">
                        <i class="bi bi-graph-up me-2"></i>
                        Statistics
                    </button>
                    <button class="btn btn-outline-secondary text-start w-100 border-0" type="button">
                        <i class="bi bi-gear me-2"></i>
                        Parameters
                    </button>
                    <button class="btn btn-outline-danger text-start w-100 border-0" type="button">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Log Out
                    </button>
                </div>

            </aside>

        </div>
    </div>
</body>
</html>
