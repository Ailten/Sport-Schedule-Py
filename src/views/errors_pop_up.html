
{% if errors is defined %}
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
    {% for error in errors %}
    <div class="toast show align-items-center text-white border-0 pop-up-error" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> 
                <strong>{{error.title}} :</strong> 
                {{error.message}}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto pop-up-error-del-button" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %} 
</div>
{% endif %}
