{% extends 'base_page.html' %}


{% block links_base %}
{% endblock links_base %}


{% set current_page = 'login' %}


{% block main_base %}
<div class="container d-flex justify-content-center align-items-center container-center-h-short">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4">

            {% include 'errors_pop_up.html' %}

            <div class="card shadow-sm border-0 px-4 py-4 rounded-3">
                <div class="card-body">

                    <h2 class="card-title text-center fw-bold mb-4 text-dark">Connection</h2>

                    <form action="/user/login" method="POST">

                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary fs-7">Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="login" placeholder="name@gmail.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary fs-7">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">Connection</button>
                        </div>

                        <div class="text-center mt-4">
                            <a href="createAcount" class="text-decoration-none small fw-bold ms-1">Create account</a>
                        </div>

                    </form>

                </div>
            </div>


        </div>
    </div>
</div>
{% endblock main_base %}
